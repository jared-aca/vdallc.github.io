name: Publish GitHub Pages
on:
  push:
    branches: [main]
    paths-ignore:
      - data/cms.json
      - data/seo-plan.json
      - README.md
      - "oauth-worker/**"
  workflow_dispatch:
    inputs:
      release_mode:
        description: Use content mode for normal publishing; choose final only after all legacy 301s are active.
        type: choice
        options:
          - content
          - final_redirect_migration
        default: content
        required: true
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: Build the Next.js static export
        run: npm run build
        env:
          VDA_ARTICLE_REDIRECT_STAGE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release_mode == 'final_redirect_migration' && 'final' || 'staged' }}
      - name: Verify generated CMS metadata and canonical compatibility pages
        run: npm run check:export
        env:
          VDA_ARTICLE_REDIRECT_STAGE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release_mode == 'final_redirect_migration' && 'final' || 'staged' }}
      - name: Confirm the staged release preserves legacy article URLs
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.release_mode != 'final_redirect_migration' }}
        run: npm run check:staged-redirects
      - name: Require all direct HTTP 301s for the final article migration
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release_mode == 'final_redirect_migration' }}
        run: npm run check:redirects
      - run: npm run check:links
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify Pages is serving this Next.js export artifact
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
          GITHUB_SHA: ${{ github.sha }}
        run: node scripts/check-deployed-pages-artifact.mjs
